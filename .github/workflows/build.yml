name: Build Paper 26.2 Integrated Jar
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21' 
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Update Gradle Wrapper
      run: |
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 9.0 || true

    # 1. paperweight의 정식 빌드 및 난독화 해제(reobf) 프로세스를 수행합니다.
    - name: Run Formal Shadow Production Build
      run: |
        ./gradlew build -x test --no-daemon

    # 2. 🌟 paperweight가 최종 완성해 두는 'reobfJar' 및 'libs' 폴더에서 진짜 플러그인만 솎아냅니다.
    - name: Prepare Final Release Jars
      run: |
        mkdir -p final_output
        
        # 임시 툴 파일(mappedServerJar, -dev, -sources)을 철저히 차단하고,
        # reobfJar 폴더나 build/libs 폴더에 있는 진짜 플러그인 JAR 파일만 수집합니다.
        find . -type f -name "*.jar" ! -name "*mappedServerJar*" ! -name "*-sources.jar" ! -name "*-javadoc.jar" ! -name "*-dev.jar" | grep -E "reobfJar|libs" | xargs -I {} cp {} final_output/
        
        echo "=== Collected Release Jars ==="
        ls -lh final_output/

    # 3. 진짜 알짜배기 플러그인들만 업로드
    - name: Upload Integrated Jar
      uses: actions/upload-artifact@v4
      with:
        name: MechanicsCore-1.26.2-Bundle
        path: "final_output/*.jar"
