name: Build Paper 26.2 Integrated Jar
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21' 
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Update Gradle Wrapper
      run: |
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 9.0 || true

    # 1. 모든 하위 서브모듈 컴파일
    - name: Compile All Submodules
      run: |
        ./gradlew compileJava assemble --no-daemon

    # 2. 🌟 더 정밀해진 메인 JAR 탐색 및 서브모듈 클래스 병합 작업
    - name: Merge Submodules into Main Jar
      run: |
        mkdir -p extracted_main extracted_sub final_output
        
        # 601바이트 같은 껍데기를 피하기 위해, 용량이 100KB(100k) 이상인 진짜 플러그인 JAR 후보들을 찾습니다.
        # 그중 이름에 'MechanicsCore' 또는 'build'가 포함된 핵심 배포 파일을 타겟팅합니다.
        MAIN_JAR=$(find . -name "*.jar" -type f -size +100k ! -name "*-sources.jar" ! -name "*-javadoc.jar" | grep -i -E "MechanicsCore|build|paper" | head -n 1)
        echo "Found Main JAR: $MAIN_JAR"
        
        # 1.26.2 NMS 호환성 클래스가 들어있을 법한 모든 서브모듈 JAR들을 수집합니다.
        SUB_JARS=$(find . -name "*.jar" -type f ! -name "*-sources.jar" ! -name "*-javadoc.jar" | grep -v "$MAIN_JAR")
        
        if [ ! -z "$MAIN_JAR" ] && [ -f "$MAIN_JAR" ]; then
          cd extracted_main
          jar -xf "../$MAIN_JAR"
          cd ..
          
          # 발견된 서브모듈의 알맹이(클래스)들을 메인 코어 내부로 주입
          for sub in $SUB_JARS; do
            echo "Merging sub-module components from: $sub"
            cd extracted_sub
            jar -xf "../$sub"
            # 실제 호환성 소스코드 클래스들만 추출하여 메인 구조에 동기화 (META-INF 제외)
            rsync -av --exclude='META-INF/' . ../extracted_main/
            rm -rf *
            cd ..
          done
          
          # 하나의 완벽한 통합 JAR로 리패키징
          cd extracted_main
          jar -cf ../MechanicsCore-Integrated.jar .
          cd ..
          
          mv MechanicsCore-Integrated.jar final_output/
          
          # WeaponMechanics 본체 파일도 있다면 함께 챙겨서 출력 폴더로 복사
          WM_JAR=$(find . -name "*WeaponMechanics*.jar" -type f -size +100k ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          if [ ! -z "$WM_JAR" ] && [ -f "$WM_JAR" ]; then
            echo "Found WeaponMechanics JAR: $WM_JAR"
            cp "$WM_JAR" final_output/WeaponMechanics-Integrated.jar
          fi
        else
          echo "❌ Error: Suitable Main JAR (>100KB) could not be located. Dumping all discovered jars for debug:"
          find . -name "*.jar" -type f
          exit 1
        fi

    # 3. 완벽하게 하나로 통합된 배포용 결과물만 쏙 업로드
    - name: Upload Integrated Jar
      uses: actions/upload-artifact@v4
      with:
        name: MechanicsCore-1.26.2-Bundle
        path: "final_output/*.jar"
