name: Build Jar
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21' 
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Update Gradle Wrapper
      run: |
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 9.0 || true

    - name: Build Genuine Integrated Jar
      run: |
        ./gradlew :mechanicscore-build:shadowJar --no-daemon || ./gradlew :build:shadowJar --no-daemon || ./gradlew :paper:assemble --no-daemon

    - name: Upload All Built Jars
      uses: actions/upload-artifact@v4
      with:
        name: Built-PR-Jars
        path: "**/build/libs/*.jar"
