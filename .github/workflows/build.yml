name: Build Paper 26.2 Integrated Jar
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21' 
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Update Gradle Wrapper
      run: |
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 9.0 || true

    # 1. 🌟 모호한 build 대신, 최종 통합본을 완성시키는 reobfJar와 shadowJar를 명시적으로 실행합니다.
    - name: Run Dedicated Plugin Bundling
      run: |
        ./gradlew reobfJar shadowJar assemble -x test --no-daemon || ./gradlew assemble --no-daemon

    # 2. 🌟 생성된 수많은 파일 중, 쓸데없는 임시 파일과 소스 파일을 제외한 모든 플러그인 후보를 수집합니다.
    - name: Prepare Final Release Jars
      run: |
        mkdir -p final_output
        
        # 특정 용량(+1M) 제한을 풀고, 빌드 및 배포 폴더 내부의 온전한 빌드본을 안전하게 수집합니다.
        find . -type f -name "*.jar" \
          ! -name "*mappedServerJar*" \
          ! -name "*-sources.jar" \
          ! -name "*-javadoc.jar" \
          ! -name "*-dev.jar" \
          -exec cp {} final_output/ \;
        
        echo "=== Extracted Jars for Review ==="
        ls -lh final_output/

    # 3. 수집된 결과물 업로드
    - name: Upload Integrated Jar
      uses: actions/upload-artifact@v4
      with:
        name: MechanicsCore-1.26.2-FINAL
        path: "final_output/*.jar"
