name: Build Jar
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17' 
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Update Gradle Wrapper
      run: |
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 9.0 || true

    # 🌟 무조건 코드를 컴파일하고 shadowJar(의존성 통합 파일)를 제대로 빌드하도록 수정
    - name: Build and Package Jars
      run: |
        ./gradlew :MechanicsCore:shadowJar --no-daemon || ./gradlew :shadowJar --no-daemon || ./gradlew assemble --no-daemon

    - name: Upload All Built Jars
      uses: actions/upload-artifact@v4
      with:
        name: Built-PR-Jars
        path: "**/build/libs/*.jar"
