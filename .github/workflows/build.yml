name: Build Jar
on: [push, workflow_dispatch] # workflow_dispatch가 있으면 버튼을 눌러 수동 빌드가 가능합니다.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0  # 필요한 경우 전체 히스토리까지 안전하게 수집
    
    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Main Jars Only
      run: |
        chmod +x gradlew
        # 에러가 나는 서브모듈(:geysermc, :mythicmobs) 컴파일 작업을 건너뛰고 메인 빌드만 실행합니다.
        ./gradlew :WeaponMechanics:shadowJar || ./gradlew :WeaponMechanics:jar || ./gradlew shadowJar -x :geysermc:compileJava -x :mythicmobs:compileJava

    - name: Upload All Built Jars
      uses: actions/upload-artifact@v4
      with:
        name: WeaponMechanics-PR-Jars
        path: "**/build/libs/*.jar"
