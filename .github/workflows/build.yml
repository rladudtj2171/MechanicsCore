name: Build Jar
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0
    
    # 1. 🌟 플러그인이 요구하는 Java 17 버전으로 하향 조정
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17' 
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # 2. 🌟 paperweight 2.0.0-beta.21 호환을 위해 Gradle 버전을 9.0으로 업그레이드
    - name: Update Gradle Wrapper
      run: |
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 9.0 || true

    - name: Build and Package Jars
      run: |
        ./gradlew shadowJar -x compileJava || ./gradlew assemble --no-daemon || ./gradlew build -x test -x compileJava

    - name: Upload All Built Jars
      uses: actions/upload-artifact@v4
      with:
        name: Built-PR-Jars
        path: "**/build/libs/*.jar"
