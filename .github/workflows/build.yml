name: Build Paper 26.2 Pure Integration
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21' 
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # 1. 🌟 [핵심 해결] Gradle 9.0 태스크 의존성 꼬임(mappedServerJar 에러) 방지 패치 주입
    - name: Patch Gradle Task Dependencies for Paperweight
      run: |
        # 1.26.2 모듈을 settings.gradle.kts에 정식 포함시킵니다.
        if [ -f "settings.gradle.kts" ] && ! grep -q "v26_2_R1" settings.gradle.kts; then
          echo 'include(":mechanicscore-platforms:paper:v26_2_R1")' >> settings.gradle.kts
          echo "🌟 Injected v26_2_R1 platform into settings"
        fi

        # 모든 build.gradle.kts 파일을 찾아서 compileJava가 paperweightSetup에 의존하도록 강제 지정을 심습니다.
        find . -name "build.gradle.kts" -type f | while read -r gradle_file; do
          echo "" >> "$gradle_file"
          echo 'tasks.withType<JavaCompile>().configureEach { dependsOn(tasks.matching { it.name.contains("paperweight") || it.name.contains("Setup") }) }' >> "$gradle_file"
        done
        echo "🌟 Applied explicit paperweight task dependencies to all modules"

    - name: Update Gradle Wrapper
      run: |
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 9.0 || true

    # 2. 패치된 명세를 바탕으로 정식 빌드를 수행합니다.
    - name: Run Formal Shadow Production Build
      run: |
        ./gradlew :mechanicscore-build:shadowJar :WeaponMechanics:shadowJar assemble -x test --no-daemon || ./gradlew shadowJar assemble -x test --no-daemon

    # 3. 내부 검사를 거쳐 plugin.yml이 담긴 진짜 최종 완성본 플러그인만 수집합니다.
    - name: Filter and Collect Final Real Plugins
      run: |
        mkdir -p final_output
        
        find . -type f -name "*.jar" ! -name "*mappedServerJar*" ! -name "*-sources.jar" ! -name "*-javadoc.jar" ! -name "*-dev.jar" | while read -r jar_file; do
          if jar tf "$jar_file" | grep -q -E "plugin.yml|paper-plugin.yml"; then
            echo "🎯 Verified Real Plugin Jar: $jar_file"
            cp "$jar_file" final_output/
          fi
        done
        
        echo "=== Ultimate Output List ==="
        ls -lh final_output/

    # 4. 최종 결과물 업로드
    - name: Upload Verified Plugin
      uses: actions/upload-artifact@v4
      with:
        name: MechanicsCore-1.26.2-RELEASE
        path: "final_output/*.jar"
