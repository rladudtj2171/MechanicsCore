name: Build Jar
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0
    
    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26' 
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Update Gradle Wrapper
      run: |
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 8.11 || true

    # 🌟 MechanicsCore 루트 기준에 맞춘 빌드 명령어로 수정
    # 특정 프로젝트 명칭 대신 전체 shadowJar 또는 build를 시도하여 에러가 나는 컴파일만 건너뜁니다.
    - name: Build and Package Jars
      run: |
        ./gradlew shadowJar -x compileJava || ./gradlew assemble --no-daemon || ./gradlew build -x test -x compileJava

    - name: Upload All Built Jars
      uses: actions/upload-artifact@v4
      with:
        name: Built-PR-Jars
        path: "**/build/libs/*.jar"
