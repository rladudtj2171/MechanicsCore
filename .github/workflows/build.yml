name: Build Paper 26.2 Ultimate Fix
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21' 
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Inject v26_2_R1 into Gradle Settings
      run: |
        if [ -f "settings.gradle.kts" ] && ! grep -q "v26_2_R1" settings.gradle.kts; then
          echo 'include(":mechanicscore-platforms:paper:v26_2_R1")' >> settings.gradle.kts
          echo "🌟 Injected v26_2_R1 platform into settings"
        fi

    # 🌟 [해결 핵심] 자바 컴파일 출력물과 jar 패키징 간의 선후 관계 규칙(compileJava 에러)을 
    # build.gradle.kts 파일 맨 밑에 물리적으로 추가 주입합니다.
    - name: Physically Inject Multi-Module Cross Dependencies
      run: |
        TARGET_GRADLE="mechanicscore-platforms/paper/v26_2_R1/build.gradle.kts"
        if [ -f "$TARGET_GRADLE" ]; then
          echo "" >> "$TARGET_GRADLE"
          
          # 1. compileJava 단계가 두 형태의 paperweightSetup 태스크에 모두 의존하도록 고정
          echo 'tasks.named<JavaCompile>("compileJava") { dependsOn(":mechanicscore-platforms:paper:v26_2_R1:paperweightUserdevSetup") }' >> "$TARGET_GRADLE"
          echo 'tasks.named<JavaCompile>("compileJava") { dependsOn(":v26_2_R1:paperweightUserdevSetup") }' >> "$TARGET_GRADLE"
          
          # 2. 리소스 처리와 최종 jar 패키징 순서 고정
          echo 'tasks.named<Jar>("jar") { dependsOn(":mechanicscore-platforms:paper:v26_2_R1:processResources") }' >> "$TARGET_GRADLE"
          echo 'tasks.named<Jar>("jar") { dependsOn(":v26_2_R1:processResources") }' >> "$TARGET_GRADLE"
          
          # 3. 🌟 [이번 에러 해결] 자바 컴파일이 완전히 끝난 뒤에 jar가 묶이도록 명시적 선후 관계 강제 주입
          echo 'tasks.named<Jar>("jar") { dependsOn(":mechanicscore-platforms:paper:v26_2_R1:compileJava") }' >> "$TARGET_GRADLE"
          echo 'tasks.named<Jar>("jar") { dependsOn(":v26_2_R1:compileJava") }' >> "$TARGET_GRADLE"
          
          echo "🌟 Successfully injected all 6 cross dependencies into $TARGET_GRADLE"
        else
          echo "❌ Target gradle file missing!"
          exit 1
        fi

    - name: Update Gradle Wrapper to 9.0
      run: |
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 9.0 --no-daemon

    # 정식 빌드를 수행합니다. (모든 규칙 위반 요소가 파일 레벨에서 강제 해결되어 성공합니다.)
    - name: Execution Formal Production Build
      run: |
        ./gradlew :mechanicscore-build:shadowJar assemble -x test --no-daemon --no-configuration-cache || \
        ./gradlew shadowJar assemble -x test --no-daemon --no-configuration-cache

    # 내부에 진짜 플러그인 설정 문서(plugin.yml)가 실존하는 완성형 파일만 필터링 수집합니다.
    - name: Filter and Collect Final Real Plugins
      run: |
        mkdir -p final_output
        
        find . -type f -name "*.jar" ! -name "*mappedServerJar*" ! -name "*-sources.jar" ! -name "*-javadoc.jar" ! -name "*-dev.jar" | while read -r jar_file; do
          if jar tf "$jar_file" | grep -q -E "plugin.yml|paper-plugin.yml"; then
            echo "🎯 Verified Real Plugin Jar: $jar_file"
            cp "$jar_file" final_output/
          fi
        done
        
        echo "=== Ultimate Output List ==="
        ls -lh final_output/

    # 최종 결과물 업로드
    - name: Upload Verified Plugin
      uses: actions/upload-artifact@v4
      with:
        name: MechanicsCore-1.26.2-RELEASE
        path: "final_output/*.jar"
