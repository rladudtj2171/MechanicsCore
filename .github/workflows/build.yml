name: Build Jar
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21' 
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Update Gradle Wrapper
      run: |
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 9.0 || true

    # 🌟 어떤 서브모듈에 shadowJar가 있는지 묻지 않고, 전체 모듈의 산출물을 컴파일하여 완전하게 조립합니다.
    - name: Build and Package Jars
      run: |
        ./gradlew assemble --no-daemon

    - name: Upload All Built Jars
      uses: actions/upload-artifact@v4
      with:
        name: Built-PR-Jars
        path: "**/build/libs/*.jar"
