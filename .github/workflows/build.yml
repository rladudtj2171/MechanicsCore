name: Build Paper 26.2 Ultimate Fix
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0
    
    # 1. 🌟 플러그인 요구 스펙에 맞춰 Java 21 완벽 고정
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21' 
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # 2. 🌟 1.26.2 모듈을 settings.gradle.kts에 정식 인클루드합니다.
    - name: Inject v26_2_R1 into Gradle Settings
      run: |
        if [ -f "settings.gradle.kts" ] && ! grep -q "v26_2_R1" settings.gradle.kts; then
          echo 'include(":mechanicscore-platforms:paper:v26_2_R1")' >> settings.gradle.kts
          echo "🌟 Injected v26_2_R1 platform into settings"
        fi

    # 3. 🌟 paperweight가 무조건 요구하는 Gradle 9.0 버전으로 재고정 (클래스패스 결합 오류 해결)
    - name: Update Gradle Wrapper to 9.0
      run: |
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 9.0 --no-daemon

    # 4. 🌟 [가장 중요] mappedServerJar 순서가 꼬이지 않도록, 개발자 환경 구성 태스크를 '독립적'으로 먼저 끝내버립니다.
    - name: Step 1 - Pre-Setup Paperweight Development Environment
      run: |
        ./gradlew :mechanicscore-platforms:paper:v26_2_R1:paperweightUserdevSetup --no-daemon || true
        ./gradlew paperweightUserdevSetup --no-daemon || true

    # 5. 🌟 앞선 세팅이 완전히 끝난 안전한 상태에서 실질적인 플러그인 본체 및 소스코드 컴파일 빌드를 수행합니다.
    - name: Step 2 - Execution Formal Production Build
      run: |
        ./gradlew :mechanicscore-build:shadowJar :WeaponMechanics:shadowJar assemble -x test --no-daemon || ./gradlew shadowJar assemble -x test --no-daemon

    # 6. 내부에 진짜 플러그인 설정 문서(plugin.yml)가 실존하는 알짜배기 완성형 파일만 필터링 수집합니다.
    - name: Filter and Collect Final Real Plugins
      run: |
        mkdir -p final_output
        
        find . -type f -name "*.jar" ! -name "*mappedServerJar*" ! -name "*-sources.jar" ! -name "*-javadoc.jar" ! -name "*-dev.jar" | while read -r jar_file; do
          if jar tf "$jar_file" | grep -q -E "plugin.yml|paper-plugin.yml"; then
            echo "🎯 Verified Real Plugin Jar: $jar_file"
            cp "$jar_file" final_output/
          fi
        done
        
        echo "=== Ultimate Output List ==="
        ls -lh final_output/

    # 7. 완벽하게 리패키징이 검증된 단 하나의 완성본 파일 업로드
    - name: Upload Verified Plugin
      uses: actions/upload-artifact@v4
      with:
        name: MechanicsCore-1.26.2-RELEASE
        path: "final_output/*.jar"
