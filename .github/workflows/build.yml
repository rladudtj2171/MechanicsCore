name: Build Paper 26.2 Integrated Jar
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0
    
    # Java 21 및 Gradle 9.0 환경 고정
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21' 
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Update Gradle Wrapper
      run: |
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 9.0 || true

    # 정식 빌드 프로세스 가동 (모든 의존성과 버전별 클래스 결합 유도)
    - name: Run Formal Shadow Production Build
      run: |
        ./gradlew build -x test --no-daemon

    # 🌟 14개 파편을 버리고, 오직 '최종 배포용 거대 JAR' 폴더만 콕 집어서 수집합니다.
    - name: Prepare Final Release Jars
      run: |
        mkdir -p final_output
        
        # MechanicsCore 계열의 최종 산출물이 모이는 표준 릴리스 폴더(build-jars 또는 대형 JAR 전용)를 수집
        find . -type f -name "*.jar" -size +1M ! -name "*-sources.jar" ! -name "*-javadoc.jar" ! -name "*mappedServerJar*" -exec cp {} final_output/ \;
        
        echo "=== Final Distribution Jars ==="
        ls -lh final_output/

    - name: Upload Integrated Jar
      uses: actions/upload-artifact@v4
      with:
        name: MechanicsCore-1.26.2-FINAL
        path: "final_output/*.jar"
