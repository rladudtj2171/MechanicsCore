name: Build Paper 26.2 Integrated Jar
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21' 
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Update Gradle Wrapper
      run: |
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 9.0 || true

    # 1. 🌟 의존성(CommandAPI 등)과 NMS 호환 코드가 shadow화되도록 정식 build 태스크를 수행합니다.
    # 테스트 코드는 빌드 속도를 위해 제외합니다.
    - name: Run Formal Shadow Production Build
      run: |
        ./gradlew build -x test --no-daemon

    # 2. 🌟 빌드가 끝난 뒤 생성된 수많은 파일 중 '가장 알짜배기 최종 배포용 JAR'들만 찾아 수집합니다.
    - name: Prepare Final Release Jars
      run: |
        mkdir -p final_output
        
        # 601바이트 같은 껍데기를 제외하고, 라이브러리가 포함되어 용량이 최소 1MB(+1M) 이상인 완성본 JAR만 복사합니다.
        # 소스코드(-sources)나 자바독(-javadoc) 파일은 제외합니다.
        find . -name "*.jar" -type f -size +1M ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp {} final_output/ \;
        
        echo "=== Collected Release Jars ==="
        ls -lh final_output/

    # 3. 완벽하게 라이브러리가 내장된 JAR 파일들만 아티팩트로 업로드
    - name: Upload Integrated Jar
      uses: actions/upload-artifact@v4
      with:
        name: MechanicsCore-1.26.2-Bundle
        path: "final_output/*.jar"
